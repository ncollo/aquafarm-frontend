name: Frontend CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # ─── Job 1: Typecheck & Vite Production Build ───
  build-and-validate:
    name: Build & Validate Frontend Bundle
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Compile TypeScript & Build Vite Distribution
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://aquafarm-backend.azurewebsites.net/api' }}

  # ─── Job 2: Docker Build & Verification ───
  docker-build-test:
    name: Build & Verify Nginx Docker Image
    runs-on: ubuntu-latest
    needs: [build-and-validate]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: aquafarm-frontend:test
